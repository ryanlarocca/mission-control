<!DOCTYPE html><html><head><title>- f8® Real Estate Media</title></head><body>
<!-- TRIMMED real page, 2026-10-15: listing download form + image-group forms + first image cards + scripts. _token scrubbed. -->
<div>
<form x-data="listingDownload()" x-on:submit.prevent="fetchDownloadLinks">
<input type="hidden" name="_token" value="FIXTURE_TOKEN" autocomplete="off">
<div><div><div>
<label key="print_images"><input x-bind:disabled="loading" type="checkbox" name="print_quality_images" checked /><span>Print Quality Images (36)</span></label>
<label key="web_images"><input x-bind:disabled="loading" type="checkbox" name="web_quality_images" checked /><span>Web / MLS Quality Images (36)</span></label>
</div></div>
<div><div><label><input x-bind:disabled="loading" type="checkbox" name="download_property_website_links" checked /><span>Property Websites</span></label></div></div>
</div>
<button x-bind:disabled="loading" x-bind:class="{ 'loading': loading }"><span x-text="downloadButtonText"></span></button>
</form>
<script type="application/javascript">
    function listingDownload() {
        const downloadLinksUrl = "https://f8.f8re.com/v2/listing/01a136a0-d777-7338-9063-d76425919515/download/json";
        const foundryUrl = "https://foundry.aryeo.com/api/zip";
        return { loading: false, boost_listing_checkbox: false, downloadButtonText: "Download",
            fetchDownloadLinks(e) { const form = e.target; const formData = new FormData(form); this.loading = true;
                fetch(downloadLinksUrl, { method: 'post', body: formData }).then(res => { if (!res.ok) { throw new Error('Download request failed'); } return res.json(); }).then(this.downloadZip).finally(() => { this.loading = false; }); },
            downloadZip(downloadData) { const form = document.createElement('form'); form.method = 'post'; form.action = foundryUrl;
                const nameField = document.createElement('input'); nameField.type = 'hidden'; nameField.name = 'name'; nameField.value = downloadData.zip_name; form.appendChild(nameField);
                const dataField = document.createElement('input'); dataField.type = 'hidden'; dataField.name = 'data'; dataField.value = JSON.stringify(downloadData.download_data); form.appendChild(dataField);
                document.body.appendChild(form); form.submit(); } } }
</script>
<div><div>
<h4>Images (36)</h4>
<form method="POST"
x-on:submit.prevent="fetchDownloadLinks($event, 'https://f8.f8re.com/01a136a0-d777-7338-9063-d76425919515/image-groups/unassigned/download/print', 'https://foundry.aryeo.com/api/zip')">
<input type="hidden" name="_token" value="FIXTURE_TOKEN" autocomplete="off">    <button type="submit">Print Quality</button>
</form>
<form method="POST"
x-on:submit.prevent="fetchDownloadLinks($event, 'https://f8.f8re.com/01a136a0-d777-7338-9063-d76425919515/image-groups/unassigned/download/web', 'https://foundry.aryeo.com/api/zip')">
<input type="hidden" name="_token" value="FIXTURE_TOKEN" autocomplete="off">    <button type="submit">Web Quality</button>
</form>
</div>
<div>
<div><div><div><button x-on:click="showGallery(0)"><img src="https://aryeo.com/cdn-cgi/image/width=600,height=350,quality=72,format=auto/https://cdn.aryeo.com/listings/5764-halleck-dr-san-jose-ca-95123-29967112/resized/large/large-01a13f27-25f0-70c7-afe3-f20f1c3a52fa.jpeg" alt="" /></button></div>
<div><p><span>Filename:</span><span>001_F8_5764 Halleck Dr.JPG</span></p></div>
<div>
<form method="POST" action="https://f8.f8re.com/images/01a13f27-25f0-70c7-afe3-f20f1c3a52fa/download/print"><input type="hidden" name="_token" value="FIXTURE_TOKEN" autocomplete="off">    <button type="submit">Print Quality</button></form>
<form method="POST" action="https://f8.f8re.com/images/01a13f27-25f0-70c7-afe3-f20f1c3a52fa/download/web"><input type="hidden" name="_token" value="FIXTURE_TOKEN" autocomplete="off">    <button type="submit">Web Quality</button></form>
</div></div>
<div><div><button x-on:click="showGallery(1)"><img src="https://aryeo.com/cdn-cgi/image/width=600,height=350,quality=72,format=auto/https://cdn.aryeo.com/listings/5764-halleck-dr-san-jose-ca-95123-29967112/resized/large/large-01a13f27-26b3-7126-9e0a-5d38caa4adba.jpeg" alt="" /></button></div>
<div><p><span>Filename:</span><span>002_F8_5764 Halleck Dr.JPG</span></p></div>
<div>
<form method="POST" action="https://f8.f8re.com/images/01a13f27-26b3-7126-9e0a-5d38caa4adba/download/print"><input type="hidden" name="_token" value="FIXTURE_TOKEN" autocomplete="off">    <button type="submit">Print Quality</button></form>
<form method="POST" action="https://f8.f8re.com/images/01a13f27-26b3-7126-9e0a-5d38caa4adba/download/web"><input type="hidden" name="_token" value="FIXTURE_TOKEN" autocomplete="off">    <button type="submit">Web Quality</button></form>
</div></div>
</div>
</div></div>
<script>
        function fetchDownloadLinks(e, url, foundryUrl) {
            const form = e.target; const formData = new FormData(form); this.loading = true;
            fetch(url, { method: 'post', body: formData }).then(res => res.json()).then(res => this.downloadZip(res, foundryUrl)).finally(() => { this.loading = false; });
        }
        function downloadZip(downloadData, foundryUrl) {
            const form = document.createElement('form'); form.method = 'post'; form.action = foundryUrl;
            const nameField = document.createElement('input'); nameField.type = 'hidden'; nameField.name = 'name'; nameField.value = downloadData.zip_name; form.appendChild(nameField);
            const dataField = document.createElement('input'); dataField.type = 'hidden'; dataField.name = 'data'; dataField.value = JSON.stringify(downloadData.download_data); form.appendChild(dataField);
            document.body.appendChild(form); form.submit();
        }
</script>
</body></html>
